# P6Spy 配置 —— 通过 com.p6spy.engine.spy.P6SpyDriver 代理真实 JDBC 驱动
#
# 用法：JDBC URL 前缀加 p6spy:，例如
#   jdbc:p6spy:postgresql://host:port/db
# 真实驱动由 driverlist 声明，P6Spy 会按 URL 自动匹配。

# 模块：仅启用日志拦截（P6LogFactory），不启用开销统计/outage 模块
modulelist=com.p6spy.engine.spy.P6SpyFactory,com.p6spy.engine.logging.P6LogFactory

# 真实驱动清单（逗号分隔）：P6Spy 代理以下驱动
driverlist=org.postgresql.Driver

# 日志输出：走 SLF4J，与 logback-spring.xml 统一（logger 名为 p6spy）
appender=com.p6spy.engine.spy.appender.Slf4JLogger

# 日志格式：自定义，含 SQL 类型、执行耗时、当前行数
# 可用变量：%(connectionId) %(currentTime) %(executionTime) %(category) %(effectiveSql) %(sqlSingleLine)
# logMessageFormat 指定格式化策略类（实现 MessageFormattingStrategy），customLogMessageFormat 指定该策略使用的格式模板
logMessageFormat=com.p6spy.engine.spy.appender.CustomLineFormat
customLogMessageFormat=%(currentTime) | took %(executionTime)ms | %(category) | connection %(connectionId) | %(sqlSingleLine)

# 过滤类别（减少噪声）：info=连接信息, result=结果集, batch=批处理, resultset=游标
excludecategories=info,debug,result,batch,resultset

# SQL 过滤：filter=true 后按 include/exclude 正则过滤；排除连接池保活探测（HikariCP housekeeper 的 SELECT 1）
filter=true
exclude=SELECT 1

# 日期格式
dateformat=yyyy-MM-dd HH:mm:ss.SSS

# 慢 SQL 阈值（毫秒）：超过仅由 outage 模块处理，此处用 logger 层的 WARN 表达
# P6Spy 默认 all 记录；慢 SQL 上报依赖 outage 模块，未启用时可在 logback 中对 p6spy 级别控制
# outagedetection=true 时启用长事务探测（基于外线程检测，会定期采样）
outagedetection=false
# outagedetectioninterval=3000

# 实际 SQL 替换占位符为真实参数值（便于排查）
redefinebatchedstatements=false
# 不截断 SQL
maxLength=0

# 字符集
useprefix=true
excludebinary=true

# 是否在日志中包含回车换行（false=单行输出，便于 grep）
multiline=false
