spring:
  profiles:
    active: single
  datasource:
    url: jdbc:p6spy:postgresql://127.0.0.1:5432/ww?currentSchema=public&preferQueryMode=simple
    username: postgres
    password: jw3344...
    driver-class-name: com.p6spy.engine.spy.P6SpyDriver
    # HikariCP 连接池：默认配置适用于开发/单机/容器多节点
    # 生产环境参数由 application-prod.yml 覆盖
    hikari:
      # 连接池大小：建议 (2*CPU核数) ~ (CPU核数*2 + 磁盘数)
      # 异步 IO 密集型应用（虚拟线程）可适当上调
      maximum-pool-size: 20
      minimum-idle: 5
      # 获取连接超时：超过抛 SQLTransientConnectionException
      connection-timeout: 30000
      # 空闲连接存活时间：超过回收（minimum-idle 之外的连接）
      idle-timeout: 600000
      # 连接最大生命周期：定期重建，避免 DB 端主动断连导致的 stale 连接
      max-lifetime: 1800000
      # 连接活跃性探测（借出前执行 lightweight query，失败则丢弃）
      connection-test-query: SELECT 1
      # 连接泄露检测阈值：0=禁用，>0 表示毫秒数（超过未归还的连接会被日志警告）
      # 开发环境建议 60000，生产环境建议 0（依赖监控告警而非主动检测）
      leak-detection-threshold: 60000
      # 自动提交：保持默认 true，由 Spring 事务管理器统一控制事务边界
      auto-commit: true
      # 连接池名（便于监控/JMX 识别）
      pool-name: HikariCP-ww
  servlet:
    multipart:
      enabled: true
      max-file-size: 2GB
      max-request-size: 2GB
      file-size-threshold: 0
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        # 自定义方言：ddl-auto 生成表结构时禁止创建外键（详见 NoForeignKeyPostgreSQLDialect）
        dialect: com.ww.admin.config.NoForeignKeyPostgreSQLDialect
        jdbc:
          batch_size: 50
          batch_versioned_data: true
        order_inserts: true
        order_updates: true
        # Batch Fetch 阈值：治理关联 N+1（与 @BatchSize / EntityGraph 协同）
        default_batch_fetch_size: 16
  # 启用虚拟线程：Servlet 请求与 @Async 任务跑在虚拟线程上，IO 阻塞不占用平台线程
  threads:
    virtual:
      enabled: true
logging:
  level:
    org.hibernate.orm.connections: warn

# Shiro 权限框架配置
shiro:
  # Token 认证令牌有效期（秒），默认 12 小时
  token:
    ttl-seconds: 43200


# 集群配置
cluster:
  enabled: true
  replicas: 2
  # 启用动态成员管理（gossip 节点发现 + 心跳探测），集群部署必须开启
  membership-enabled: true
  # 启用 failover 自动检测：连续心跳超时后判定节点 DEAD 并触发副本提升
  failover-enabled: true
  # 启用数据重平衡：节点变更后自动迁移分片数据恢复均衡
  rebalance-enabled: true
  # 心跳探测周期（毫秒）
  heartbeat-interval-ms: 5000
  # 连续失败次数 → 标记 SUSPECT
  suspect-threshold: 2
  # 连续失败次数 → 标记 DEAD（须 >= suspectThreshold+1）
  dead-threshold: 3
  # rebalance 扫描周期（秒）
  rebalance-scan-interval-sec: 30
  nodes:
    - host: 127.0.0.1
      port: 8701
      weight: 1.0
    - host: 127.0.0.1
      port: 8702
      weight: 1.0

# 缓存配置
cache:
  port: 8701
  aof:
    enabled: false
    sync-strategy: every_second

# 对象存储配置（复用上方 cluster.* 集群拓扑；未启用 cluster 时单节点运行）
storage:
  # 本地 Drive（磁盘）根路径。留空则使用 rootDir 作为单 Drive。
  drives:
    - ./data/storage/d1
    - ./data/storage/d2
    - ./data/storage/d3
    - ./data/storage/d4
  root-dir: ./data/storage
  # 每个 Set 的 Drive 数（<=0 自动：min(节点数, Drive 数, 4)）
  drives-per-set: 0
  # 加密开关（预留，当前为透传 IdentityCryptoCodec）
  crypto-enabled: false
  # 节点间 HTTP 端口偏移：peerHttpPort = cluster.node.port + offset
  # 默认 0 时按 (server.port - cache.port) 自动推导；非对称部署可显式指定
  http-port-offset: 0
  # 节点间通信认证 token（为空不校验）
  auth-token:
  # IO 直接内存缓冲区大小（字节）：FileChannel 读写 + BufferedInputStream 缓冲
  # 默认 64KB，建议 64KB~256KB；分配在堆外，不增加 GC 压力
  io-buffer-size: 65536
  # 直接内存缓冲池上限（个数）：总堆外内存 = io-buffer-size * buffer-pool-max-size
  # 默认 64 个 = 4MB 堆外
  buffer-pool-max-size: 64
  # 对象元数据 LRU 缓存上限（条目数）：仅缓存本地主节点视角元数据
  # 默认 10000 条，估算约 2MB 堆内；0 表示禁用缓存
  metadata-cache-max-size: 10000

# 日志管理配置：后台日志采集与批量落库
log:
  # 是否将日志批量写入数据库 sys_log 表
  enabled: true
  # 每批最多写入条数
  batch-size: 200
  # 队列为空时阻塞等待毫秒数（超时即刷出当前批）
  flush-interval-ms: 1000
  # 内存队列容量（满时丢弃新日志并计数，不阻塞业务线程）
  queue-capacity: 10000
