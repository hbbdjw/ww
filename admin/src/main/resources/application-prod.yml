# 生产环境：PostgreSQL + validate（schema 迁移后续由 Flyway 接管）
spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:127.0.0.1}:${DB_PORT:5432}/${DB_NAME:ww}?preferQueryMode=simple
    username: ${DB_USER:ww}
    password: ${DB_PASS:ww}
    driver-class-name: org.postgresql.Driver
    hikari:
      # 生产环境连接池：基于 PostgreSQL 默认 max_connections=100 估算
      # 多实例部署时 single-pool * instance-count < max_connections * 0.8
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      # 连接活跃性探测：PostgreSQL 支持 isValid() 轻量校验，无需显式 SQL
      connection-test-query: SELECT 1
      # 生产环境禁用泄露检测（性能开销）：依赖监控告警
      leak-detection-threshold: 0
      auto-commit: true
      pool-name: HikariCP-ww-prod
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          batch_size: 50
          batch_versioned_data: true
        order_inserts: true
        order_updates: true
        default_batch_fetch_size: 16
