services:
  # =============================================
  # Cache 节点1（主）
  # =============================================
  ww-admin-node1:
    image: ww-admin:latest
    container_name: ww-admin-node1
    ports:
      - "8081:8081"    # HTTP
      - "8701:8701"    # cache TCP
    environment:
      - SPRING_PROFILES_ACTIVE=docker,node1
      # 容器时区与宿主机一致（默认 UTC 会导致 p6spy 等日志内嵌时间偏差 8 小时）
      - TZ=Asia/Shanghai
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ww:/app/data/storage
    networks:
      - ww-cluster-net
    restart: unless-stopped

  # =============================================
  # Cache 节点2（从）
  # =============================================
  ww-admin-node2:
    image: ww-admin:latest
    container_name: ww-admin-node2
    ports:
      - "8082:8082"    # HTTP
      - "8702:8702"    # cache TCP
    environment:
      - SPRING_PROFILES_ACTIVE=docker,node2
      - TZ=Asia/Shanghai
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ww:/app/data/storage
    networks:
      - ww-cluster-net
    restart: unless-stopped

  # =============================================
  # Cache 节点3（从）
  # =============================================
  ww-admin-node3:
    image: ww-admin:latest
    container_name: ww-admin-node3
    ports:
      - "8083:8083"    # HTTP
      - "8703:8703"    # cache TCP
    environment:
      - SPRING_PROFILES_ACTIVE=docker,node3
      - TZ=Asia/Shanghai
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ww:/app/data/storage
    networks:
      - ww-cluster-net
    restart: unless-stopped

networks:
  ww-cluster-net:
    driver: bridge
    name: ww-cluster-net

volumes:
  ww:
    external: true
