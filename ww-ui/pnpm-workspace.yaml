# pnpm 配置文件（项目已不是 monorepo，此处不包含 packages 工作区定义，
# 仅存放依赖覆盖与构建脚本白名单，pnpm 11+ 不再读取 package.json 的 pnpm 字段）
overrides:
  '@ast-grep/napi': ^0.44.1
  '@ctrl/tinycolor': ^4.2.0
  clsx: ^2.1.1
  pinia: ^4.0.2
  vue: ^3.5.40

allowBuilds:
  '@parcel/watcher': true
  core-js: true
  esbuild: true
  lefthook: true
  vue-demi: true
